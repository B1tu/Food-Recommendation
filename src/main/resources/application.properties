spring.application.name=food-recommendation

# PostgreSQL
# - Local (chạy máy bạn): dùng giá trị mặc định phía sau dấu ':' (postgres/postgres/localhost...)
# - Trên Render: đặt biến môi trường SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
#   trong Render Dashboard, Spring Boot sẽ tự đọc đè lên giá trị mặc định này.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodrecommendationdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# Gemini API
# QUAN TRONG: khong duoc de key that o day khi day len GitHub/Render.
# Dat bien moi truong GEMINI_API_KEY tren Render Dashboard.
gemini.api.key=${GEMINI_API_KEY}
gemini.base.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# CORS - URL cua frontend da deploy (dat qua bien moi truong FRONTEND_URL tren Render)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}